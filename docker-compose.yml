services:
  web:
    container_name: kamerafehervar_web
    image: ghcr.io/davids-src/kamerafehervar:main
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://kamerafehervar.hu}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://kamerafehervar.hu}
        NEXT_PUBLIC_PHONE: ${NEXT_PUBLIC_PHONE:-+36 70 273 5532}
        NEXT_PUBLIC_SIRONIC_PHONE: ${NEXT_PUBLIC_SIRONIC_PHONE:-+36 70 273 5532}
        NEXT_PUBLIC_GA_ID: ${NEXT_PUBLIC_GA_ID:-}
    ports:
      - "${PORT:-8106}:3000"
    environment:
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-https://kamerafehervar.hu}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://kamerafehervar.hu}"
      NEXT_PUBLIC_PHONE: "${NEXT_PUBLIC_PHONE:-+36 70 273 5532}"
      NEXT_PUBLIC_SIRONIC_PHONE: "${NEXT_PUBLIC_SIRONIC_PHONE:-+36 70 273 5532}"
      NEXT_PUBLIC_GA_ID: "${NEXT_PUBLIC_GA_ID:-}"
      SIROTECH_ADMIN_EMAIL: "${SIROTECH_ADMIN_EMAIL:-}"
      SMTP_HOST: "${SMTP_HOST:-smtp.forpsi.com}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_SECURE: "${SMTP_SECURE:-true}"
      SMTP_USER: "${SMTP_USER:-noreply@kamerafehervar.hu}"
      SMTP_PASS: "${SMTP_PASS:-}"
    restart: unless-stopped
    networks:
      - default
      - nginxproxy_default

networks:
  default:
    driver: bridge
  nginxproxy_default:
    external: true
