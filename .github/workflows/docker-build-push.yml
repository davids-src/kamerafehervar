name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/davids-src/kamerafehervar:main
            ghcr.io/davids-src/kamerafehervar:latest
          build-args: |
            NEXT_PUBLIC_APP_URL=https://kamerafehervar.hu
            NEXT_PUBLIC_SITE_URL=https://kamerafehervar.hu
            NEXT_PUBLIC_PHONE=+36 70 273 5532
            NEXT_PUBLIC_SIRONIC_PHONE=+36 70 273 5532
